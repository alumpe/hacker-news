<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<title>HN Reader</title>
	<style>
		.background {
			fill: #c2410c;
		}

		.glyph {
			fill: #fffdf8;
		}

		@media (prefers-color-scheme: dark) {
			.background {
				fill: #fb923c;
			}

			.glyph {
				fill: #171614;
			}
		}
	</style>
	<rect class="background" width="32" height="32" rx="7" />
	<g class="glyph">
		<rect x="3.5" y="7" width="3.5" height="18" />
		<rect x="11" y="7" width="3.5" height="18" />
		<rect x="3.5" y="14.25" width="11" height="3.5" />
		<rect x="17.5" y="7" width="3.5" height="18" />
		<rect x="25" y="7" width="3.5" height="18" />
		<polygon points="17.5,7 21,7 28.5,25 25,25" />
	</g>
</svg>
